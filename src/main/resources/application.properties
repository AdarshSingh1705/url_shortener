# Server
server.port=${PORT:8080}

# PostgreSQL
# sslmode=prefer: encrypts when the server supports it, falls back to plaintext for local dev
# without needing separate config per environment (see FIXES_APPLIED.md in the Clean India
# project for why this matters more than it sounds like it should).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlshortener}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — ddl-auto=update is fine for this demo project; a real project
# would use Flyway/Liquibase migrations instead (see README "Limitations").
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# App config
app.shortener.base-url=${BASE_URL:http://localhost:8080}
app.shortener.cache-ttl-hours=24
app.rate-limit.requests-per-window=10
app.rate-limit.window-seconds=60
